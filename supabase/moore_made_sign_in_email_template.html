<h2 style="margin:0 0 14px;font-family:Arial,sans-serif;color:#171717;">Sign in to Moore Made</h2>
<p style="margin:0 0 18px;font-family:Arial,sans-serif;color:#4d4a46;line-height:1.55;">Use either option below. Both sign you into the same Moore Made account.</p>
<p style="margin:0 0 20px;">
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#171717;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:999px;font-family:Arial,sans-serif;font-weight:700;">Sign in to Moore Made</a>
</p>
<div style="margin:0 0 18px;padding:14px 16px;border:1px solid #ded8cf;border-radius:12px;background:#faf8f4;font-family:Arial,sans-serif;">
  <div style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#77716a;font-weight:700;margin-bottom:6px;">Or enter this sign-in code</div>
  <div style="font-size:30px;letter-spacing:.14em;color:#171717;font-weight:800;">{{ .Token }}</div>
</div>
<p style="margin:0;font-family:Arial,sans-serif;color:#77716a;font-size:13px;line-height:1.5;">If you did not request this email, you can ignore it.</p>
